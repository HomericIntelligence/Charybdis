name: CodeQL SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL / C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build python3-pip

      - name: Set up Conan
        uses: ./.github/actions/conan-setup
        with:
          show_profile: true

      - name: Install Conan dependencies
        run: conan install . --output-folder=build/ci --build=missing --lockfile=conan.lock -s build_type=Release

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build (CodeQL traces the build)
        run: |
          cmake --preset ci -DCMAKE_TOOLCHAIN_FILE=build/ci/conan_toolchain.cmake
          cmake --build --preset ci

      - name: Perform CodeQL Analysis
        if: github.event_name != 'merge_group'
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          category: /language:cpp

      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('results.sarif') != '' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: results.sarif
          category: codeql-cpp
