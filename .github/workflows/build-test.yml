name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  lockfile-integrity:
    name: lockfile-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify lockfile integrity
        uses: ./.github/actions/conan-lock-check

  build-test:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    needs: [lockfile-integrity]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          uv sync --locked
          if [ "${COMPILER}" = "clang" ]; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
      - name: Install Conan dependencies
        uses: ./.github/actions/conan-install
        with:
          build_type: ${{ matrix.build_type }}
          compiler: ${{ matrix.compiler }}
      - name: Configure
        env:
          COMPILER: ${{ matrix.compiler }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          if [ "${COMPILER}" = "clang" ]; then
            export CC=clang CXX=clang++
          fi
          uv run cmake --preset "${BUILD_TYPE}"
      - name: Build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: uv run cmake --build --preset "${BUILD_TYPE}"
      - name: Test
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: uv run ctest --preset "${BUILD_TYPE}"

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: [build-test]
    if: always()
    steps:
      - name: Check build matrix result
        env:
          RESULT: ${{ needs.build-test.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "Build and Test matrix failed with: ${RESULT}"
            exit 1
          fi
          echo "Build and Test matrix passed"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    needs: [build-test]
    if: always()
    steps:
      - name: Check unit test matrix result
        env:
          RESULT: ${{ needs.build-test.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "Build and Test unit matrix failed with: ${RESULT}"
            exit 1
          fi
          echo "Build and Test unit matrix passed"

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: [build-test]
    if: always()
    steps:
      - name: Check test matrix result
        env:
          RESULT: ${{ needs.build-test.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "Build and Test test matrix failed with: ${RESULT}"
            exit 1
          fi
          echo "Build and Test test matrix passed"

  check-all:
    name: All Build/Test Checks
    runs-on: ubuntu-24.04
    needs: [build-test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test failed"; exit 1
          fi
          echo "All checks passed"
