name: Container Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    name: Docker Build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and load image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: projectcharybdis:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Issue #150: assert no builder-stage toolchain leaked into the runtime
      # stage. The entrypoint override is required because the image sets
      # ENTRYPOINT ["/usr/local/bin/charybdis"] — without it, `which cmake`
      # would run as arguments to the charybdis binary.
      - name: Smoke test - runtime image has no build tools
        run: |
          # Positive control: `which` works and the shipped binary is present.
          docker run --rm --entrypoint which projectcharybdis:local charybdis

          # Negative checks: no builder-stage toolchain in the runtime stage.
          status=0
          for tool in cmake make ninja gcc g++ git; do
            if docker run --rm --entrypoint which "projectcharybdis:local" "$tool"; then
              echo "::error::build tool '$tool' found in runtime image"
              status=1
            fi
          done
          exit "$status"

  publish:
    name: Publish Container on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-all:
    name: docker-build
    needs: [docker]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All Docker checks passed
        run: |
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Docker build failed"; exit 1
          fi
          echo "Docker build passed"

  package:
    name: package
    needs: [docker]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check container build result
        env:
          RESULT: ${{ needs.docker.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "Container package build failed with: ${RESULT}"
            exit 1
          fi
          echo "Container package build passed"
