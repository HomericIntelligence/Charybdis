name: Container Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  docker:
    name: Docker Build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore Conan package cache
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-docker-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/default', 'conan/profiles/debug') }}
          restore-keys: |
            conan-docker-${{ runner.os }}-

      - name: Pack Conan cache for Docker secret
        id: conan-pack
        run: |
          if [ -d "$HOME/.conan2" ]; then
            tar -czf "$RUNNER_TEMP/conan-cache.tgz" -C "$HOME" .conan2
            size=$(stat -c%s "$RUNNER_TEMP/conan-cache.tgz" 2>/dev/null || stat -f%z "$RUNNER_TEMP/conan-cache.tgz" 2>/dev/null || echo 0)
            if [ "$size" -lt 512000 ]; then
              echo "cache-archive=$RUNNER_TEMP/conan-cache.tgz" >> "$GITHUB_OUTPUT"
              echo "Conan cache archive $size bytes, will hydrate via secret."
            else
              echo "Conan cache archive $size bytes exceeds 500KiB BuildKit secret limit, skipping hydration."
              rm -f "$RUNNER_TEMP/conan-cache.tgz"
            fi
          else
            echo "No Conan store on runner; building without cache hydration."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build (and push on main)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: ${{ steps.conan-pack.outputs.cache-archive != '' && format('conan_cache={0}', steps.conan-pack.outputs.cache-archive) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Issue #150: assert no builder-stage toolchain leaked into the runtime
      # stage. The entrypoint override is required because the image sets
      # ENTRYPOINT ["/usr/local/bin/charybdis"] — without it, `which cmake`
      # would run as arguments to the charybdis binary.
      - name: Smoke test - runtime image has no build tools
        run: |
          # Positive control: `which` works and the shipped binary is present.
          TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm --entrypoint which "$TAG" charybdis

          # Negative checks: no builder-stage toolchain in the runtime stage.
          status=0
          for tool in cmake make ninja gcc g++ git; do
            if docker run --rm --entrypoint which "$TAG" "$tool"; then
              echo "::error::build tool '$tool' found in runtime image"
              status=1
            fi
          done
          exit "$status"

      - name: Extract hydrated Conan cache from image
        id: conan-extract
        run: |
          TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          # The loaded image is the runtime stage and does not contain the
          # builder's Conan store. Try extracting from the runtime first; if
          # that fails, rebuild the builder stage (hitting BuildKit cache) and
          # extract from there.
          cid=""
          if ! cid=$(docker create "$TAG" 2>/dev/null); then
            cid=""
          fi
          mkdir -p "$HOME/.conan2-hydrated"
          if [ -n "$cid" ] && docker cp "$cid":/home/builder/.conan2/. "$HOME/.conan2-hydrated/" 2>/dev/null; then
            echo "Extracted Conan cache from runtime image"
            if ! docker rm "$cid" >/dev/null 2>&1; then
              :
            fi
            mkdir -p "$HOME/.conan2"
            cp -a "$HOME/.conan2-hydrated/." "$HOME/.conan2/"
            exit 0
          fi
          if [ -n "$cid" ]; then
            if ! docker rm "$cid" >/dev/null 2>&1; then
              :
            fi
          fi
          echo "Runtime image has no builder Conan cache; building builder stage for extraction..."
          ARCHIVE="${{ steps.conan-pack.outputs.cache-archive }}"
          if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE" ]; then
            docker buildx build \
              --target builder \
              --secret id=conan_cache,src="$ARCHIVE" \
              --cache-from type=gha \
              --tag conan-extract:builder \
              --load \
              .
          else
            docker buildx build \
              --target builder \
              --cache-from type=gha \
              --tag conan-extract:builder \
              --load \
              .
          fi
          cid=$(docker create conan-extract:builder)
          mkdir -p "$HOME/.conan2-hydrated"
          docker cp "$cid":/home/builder/.conan2/. "$HOME/.conan2-hydrated/"
          docker rm "$cid"
          mkdir -p "$HOME/.conan2"
          cp -a "$HOME/.conan2-hydrated/." "$HOME/.conan2/"

      - name: Save Conan package cache
        if: steps.conan-extract.outcome == 'success' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-docker-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/default', 'conan/profiles/debug') }}

      - name: Assert cache hydration engaged
        if: steps.conan-cache.outputs.cache-hit == 'true' && steps.conan-pack.outputs.cache-archive != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null | grep -q "HYDRATED from secret"; then
            echo "Conan cache hydration confirmed in build log."
          else
            echo "::error::Conan cache was restored but the build log shows no HYDRATED marker"
            exit 1
          fi

  publish:
    name: Publish Container on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore Conan package cache
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: conan-docker-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/default', 'conan/profiles/debug') }}
          restore-keys: |
            conan-docker-${{ runner.os }}-

      - name: Pack Conan cache for Docker secret
        id: conan-pack
        run: |
          if [ -d "$HOME/.conan2" ]; then
            tar -czf "$RUNNER_TEMP/conan-cache.tgz" -C "$HOME" .conan2
            size=$(stat -c%s "$RUNNER_TEMP/conan-cache.tgz" 2>/dev/null || stat -f%z "$RUNNER_TEMP/conan-cache.tgz" 2>/dev/null || echo 0)
            if [ "$size" -lt 512000 ]; then
              echo "cache-archive=$RUNNER_TEMP/conan-cache.tgz" >> "$GITHUB_OUTPUT"
              echo "Conan cache archive $size bytes, will hydrate via secret."
            else
              echo "Conan cache archive $size bytes exceeds 500KiB BuildKit secret limit, skipping hydration."
              rm -f "$RUNNER_TEMP/conan-cache.tgz"
            fi
          else
            echo "No Conan store on runner; building without cache hydration."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: ${{ steps.conan-pack.outputs.cache-archive != '' && format('conan_cache={0}', steps.conan-pack.outputs.cache-archive) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-all:
    name: docker-build
    needs: [docker]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All Docker checks passed
        run: |
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Docker build failed"; exit 1
          fi
          echo "Docker build passed"

  package:
    name: package
    needs: [docker]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check container build result
        env:
          RESULT: ${{ needs.docker.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "Container package build failed with: ${RESULT}"
            exit 1
          fi
          echo "Container package build passed"
