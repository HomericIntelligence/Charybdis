name: Required Checks

on:
  workflow_run:
    workflows: ["Build and Test", "Static Analysis", "Code Coverage", "CodeQL SAST", "Sanitizers", "Lock Check", "Container Build and Publish", "Integration Tests"]
    types: [completed]

  pull_request:
    branches: [main]

  push:
    branches: [main]

  merge_group:
    types: [checks_requested]

# No concurrency cancellation for workflow_run events — they must always
# report a result so the branch ruleset check contexts are populated.
concurrency:
  group: required-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Fan-in jobs: reflect the result of upstream workflows
  # ---------------------------------------------------------------------------

  security-codeql:
    name: security/codeql
    runs-on: ubuntu-24.04
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow.name == 'CodeQL SAST'
    steps:
      - name: Check CodeQL SAST result
        if: github.event_name == 'workflow_run'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${CONCLUSION}" != "success" ]; then
            echo "CodeQL SAST workflow failed with: ${CONCLUSION}"
            exit 1
          fi
          echo "CodeQL SAST passed"
      - name: Skip (not triggered by this workflow)
        if: github.event_name != 'workflow_run'
        run: echo "Not a workflow_run event — pass (actual work done by CodeQL SAST workflow)"

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-24.04
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow.name == 'Sanitizers'
    steps:
      - name: Check Sanitizers result
        if: github.event_name == 'workflow_run'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${CONCLUSION}" != "success" ]; then
            echo "Sanitizers workflow failed with: ${CONCLUSION}"
            exit 1
          fi
          echo "Sanitizers passed"
      - name: Skip (not triggered by this workflow)
        if: github.event_name != 'workflow_run'
        run: echo "Not a workflow_run event — pass (actual work done by Sanitizers workflow)"

  uv-lock-check:
    name: uv-lock-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-uv-lock-check`.
      - name: uv-lock-check (in container)
        run: bash scripts/run_ci_local.sh uv-lock-check

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow.name == 'Container Build and Publish'
    steps:
      - name: Check Container Build and Publish result
        if: github.event_name == 'workflow_run'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${CONCLUSION}" != "success" ]; then
            echo "Container Build and Publish workflow failed with: ${CONCLUSION}"
            exit 1
          fi
          echo "Container Build and Publish passed"
      - name: Skip (not triggered by this workflow)
        if: github.event_name != 'workflow_run'
        run: echo "Not a workflow_run event — pass (actual work done by Container Build and Publish workflow)"

  # ---------------------------------------------------------------------------
  # Independent jobs: run directly on push/pull_request
  # These are skipped when triggered by workflow_run (they don't depend on
  # any upstream workflow result).
  # ---------------------------------------------------------------------------

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-forbid-suppressions`.
      - name: forbid-suppressions (in container)
        run: bash scripts/run_ci_local.sh forbid-suppressions

  # No Conan audit step exists here by design: it was removed in #221
  # (the audit command requires a subcommand plus audit.conan.io credentials
  # that are unavailable in CI; Trivy covers conan.lock CVEs and pip-audit
  # covers Python deps). Do not resurrect it.
  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-security-dependency-scan`.
      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan
      - name: Install Conan (for audit)
        run: pip3 install --user conan
      - name: "Run Conan audit (skip only when subcommand absent; #71)"
        # `conan audit` is NOT suppressed: it fails the job on any CVE at or
        # above the severity threshold, exactly like a real scan should. The
        # skip paths are the `conan audit --help` presence probe below and a
        # missing provider token (both emit ::notice:: and exit 0, no hard
        # failure, so forks without the secret stay green). The ConanCenter
        # provider token, when present, is injected via the
        # CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER env var that the Conan audit
        # API reads, sourced from the CONAN_AUDIT_TOKEN repository secret
        # (register at https://conan.io/audit/register).
        env:
          CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER: ${{ secrets.CONAN_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if ! conan audit --help >/dev/null 2>&1; then
            echo "::notice::conan audit subcommand not available in this Conan version - skipping"
            exit 0
          fi
          if [ ! -f conan.lock ]; then
            echo "::error::conan.lock missing - required for a deterministic CVE scan"
            exit 1
          fi
          if [ -z "${CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER:-}" ]; then
            echo "::notice::CONAN_AUDIT_TOKEN not set - skipping conan audit (register at https://conan.io/audit/register to enable)"
            exit 0
          fi
          conan profile detect --force >/dev/null
          # Fails (non-zero exit) when any dependency has a CVE with severity
          # >= 7.0 (CRITICAL+HIGH), matching the Trivy gate's severity stance.
          conan audit scan . -l conan.lock -sl 7.0

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace charybdis-ci:local \
              gitleaks detect --source /workspace --config .gitleaks.toml \
                --report-format sarif --report-path gitleaks.sarif --redact
          else
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace charybdis-ci:local \
              gitleaks detect --source /workspace \
                --report-format sarif --report-path gitleaks.sarif --redact
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != '' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: gitleaks.sarif

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-schema-validation`.
      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

      - name: Validate merge queue policy and fan-ins
        run: python3 scripts/test-merge-queue-policy.py

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-deps-version-sync`.
      - name: deps-version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-charybdis-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podman-charybdis-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t charybdis-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-typecheck`.
      - name: typecheck (in container)
        run: bash scripts/run_ci_local.sh typecheck

  lockfile-integrity:
    name: lockfile-integrity
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Conan
        uses: ./.github/actions/conan-setup
      - name: Regenerate lockfile
        run: |
          conan lock create . \
            -s compiler=gcc \
            -s compiler.version=14 \
            -s compiler.libcxx=libstdc++11 \
            -s compiler.cppstd=20 \
            -s build_type=Debug \
            -s os=Linux \
            -s arch=x86_64
      - name: Verify lockfile is up-to-date
        run: |
          if ! git diff --exit-code conan.lock; then
            echo "ERROR: conan.lock is out of date. Run scripts/lock.sh locally and commit the result."
            exit 1
          fi
          echo "conan.lock is up-to-date"

  # Canonical `install` check for the Odysseus ecosystem board. Builds the
  # release artifact, runs `cmake --install` into a staging prefix, and smoke-
  # tests that the installed CLI executes. Exercises the install() rules in
  # CMakeLists.txt so packaging regressions are caught on every push/PR.

  install:
    name: install
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Conan dependencies
        uses: ./.github/actions/conan-install
        with:
          build_type: release
          compiler: gcc
      - name: Configure
        run: uv run cmake --preset release
      - name: Build
        run: uv run cmake --build --preset release
      - name: Install to staging prefix
        run: uv run cmake --install build/release --prefix "${RUNNER_TEMP}/install-prefix"
      - name: Smoke-test installed CLI
        run: |
          set -euo pipefail
          # The CMake target is Charybdis_cli, but CMakeLists.txt sets
          # OUTPUT_NAME ${PROJECT_NAME}, so the installed file is
          # bin/Charybdis (no _cli suffix).
          BIN="${RUNNER_TEMP}/install-prefix/bin/Charybdis"
          if [ ! -x "${BIN}" ]; then
            echo "ERROR: installed CLI not found or not executable at ${BIN}"
            # Diagnostic listing guarded by -d so a missing prefix dir cannot
            # abort the script before the explicit exit below (set -e active).
            if [ -d "${RUNNER_TEMP}/install-prefix" ]; then
              find "${RUNNER_TEMP}/install-prefix" -maxdepth 4 -print
            fi
            exit 1
          fi
          # Run the installed binary. Accept --help success (0) or a benign
          # usage exit; fail only on crash/segfault/missing-lib exits.
          # `|| rc=$?` captures the exit code without tripping set -e.
          rc=0
          "${BIN}" --help || rc=$?
          if [ "${rc}" -ge 2 ]; then
            echo "ERROR: installed CLI exited ${rc} (>=2 indicates crash/load failure)"
            exit "${rc}"
          fi
          echo "Installed CLI ran (exit ${rc})"

  # Canonical `release` check for the Odysseus ecosystem board. The real
  # publish pipeline lives in release.yml and is tag-gated (no check-run on
  # main). This DRY-RUN validates the release prerequisites on every push/PR —
  # version parses from CMakeLists.txt and the changelog generator runs — but
  # publishes NOTHING. See release.yml for the actual tag-driven release.

  release:
    name: release
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate canonical version parses from CMakeLists.txt
        run: |
          set -euo pipefail
          CMAKE_VERSION=$(grep -A5 'project(' CMakeLists.txt \
            | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "${CMAKE_VERSION}" ]; then
            echo "ERROR: Could not parse VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Canonical version: ${CMAKE_VERSION}"
          echo "CMAKE_VERSION=${CMAKE_VERSION}" >> "${GITHUB_ENV}"
      - name: Dry-run changelog generation
        env:
          CMAKE_VERSION: ${{ env.CMAKE_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/generate-changelog.sh ]; then
            echo "ERROR: scripts/generate-changelog.sh missing — release pipeline broken"
            exit 1
          fi
          TAG_NAME="v${CMAKE_VERSION}"
          # The vX.Y.Z tag does not exist yet during a pre-release dry-run, so
          # diff the most recent existing tag against HEAD (not the unborn tag)
          # to validate the changelog generator end-to-end without a real tag.
          PREV_TAG=$(git tag --sort=-creatordate \
            | awk -v skip="${TAG_NAME}" '$0 != skip { print; exit }')
          if [ -z "${PREV_TAG}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Generating changelog fragment ${PREV_TAG}..HEAD for ${TAG_NAME} (dry-run, no publish)"
          FRAGMENT=$(bash scripts/generate-changelog.sh "${PREV_TAG}" "HEAD")
          echo "----- changelog fragment (dry-run) -----"
          echo "${FRAGMENT}"
          echo "----------------------------------------"
          echo "Release dry-run OK — no artifacts published."
