name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  asan:
    name: ASAN+UBSAN (gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked
          sudo apt-get update
          sudo apt-get install -y libasan8 libubsan1
      - name: Configure Conan
        run: uv run conan profile detect --force
      - name: Install Conan dependencies
        run: |
          uv run conan install . \
            --output-folder=build/asan \
            --build=missing \
            --lockfile=conan.lock \
            -s build_type=Debug \
            -s compiler=gcc \
            -s compiler.version=14 \
            -s compiler.libcxx=libstdc++11 \
            -s compiler.cppstd=20
      - name: Configure
        run: uv run cmake --preset asan
      - name: Build
        run: uv run cmake --build --preset asan
      - name: Test
        run: uv run ctest --preset asan

  tsan:
    name: TSan (gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Configure Conan
        run: uv run conan profile detect --force
      - name: Install Conan dependencies
        run: |
          uv run conan install . \
            --output-folder=build/tsan \
            --build=missing \
            --lockfile=conan.lock \
            -s build_type=Debug \
            -s compiler=gcc \
            -s compiler.version=14 \
            -s compiler.libcxx=libstdc++11 \
            -s compiler.cppstd=20
      - name: Configure
        run: uv run cmake --preset tsan
      - name: Build
        run: uv run cmake --build --preset tsan
      - name: Test
        env:
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/tsan.supp:second_deadlock_stack=1"
        run: uv run ctest --preset tsan

  check-all:
    name: All Sanitizer Checks
    runs-on: ubuntu-24.04
    needs: [asan, tsan]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.asan.result }}" != "success" ]; then
            echo "ASAN job failed"; exit 1
          fi
          if [ "${{ needs.tsan.result }}" != "success" ]; then
            echo "TSan job failed"; exit 1
          fi
          echo "All sanitizer checks passed"
