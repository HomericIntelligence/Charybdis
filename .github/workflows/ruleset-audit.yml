name: Ruleset Audit

# Asserts two governance invariants on the active branch-protection ruleset:
#   1. The pull_request rule exists with a valid required_approving_review_count
#      (see issue #102, follow-up from #15).
#   2. bypass_actors is empty — no actor (including repo admins) can bypass the
#      pull_request rule (issue #101).
#
# Org policy (deliberate): required_approving_review_count = 0 across all 14
# HomericIntelligence repos — approvals are NOT required to merge. This audit
# therefore only checks that the pull_request rule is present and that the
# count is a valid non-negative value (>= MIN_REVIEWERS, currently 0), not
# that approvals are actually required. It still guards against the ruleset
# being deleted or the pull_request rule silently disappearing, and against a
# bypass actor being re-added via the GitHub UI.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-branch-protection.sh"
      - ".github/workflows/ruleset-audit.yml"
  push:
    branches: [main]
  schedule:
    # Daily at 06:17 UTC — offset from the hour to avoid GH API thundering herd.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruleset-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assert-required-reviewers:
    name: assert-required-reviewers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # GITHUB_TOKEN cannot read org/repo rulesets metadata reliably; an
      # admin-scoped fine-grained PAT exposed as RULESET_AUDIT_TOKEN is
      # required. See scripts/apply-branch-protection.sh for the same scope.
      GH_TOKEN: ${{ secrets.RULESET_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
      ORG: HomericIntelligence
      REPO: Charybdis
      RULESET_NAME: homeric-main-baseline
      # Org policy is 0 required approvals on all repos (merging without
      # human approval is intentional). Do not raise this — it must track
      # the real ruleset configuration, not aspirational policy.
      MIN_REVIEWERS: "0"
    steps:
      - name: Resolve ruleset id by name
        id: resolve
        run: |
          set -euo pipefail
          RULESET_ID=$(gh api "repos/${ORG}/${REPO}/rulesets" \
            --jq ".[] | select(.name == \"${RULESET_NAME}\") | .id")
          if [ -z "${RULESET_ID}" ]; then
            echo "::error::Ruleset '${RULESET_NAME}' not found on ${ORG}/${REPO}."
            echo "Run scripts/apply-branch-protection.sh to create it." >&2
            exit 1
          fi
          echo "Found ruleset '${RULESET_NAME}' (id=${RULESET_ID})"
          echo "ruleset_id=${RULESET_ID}" >> "${GITHUB_OUTPUT}"

      - name: Assert required_approving_review_count >= ${{ env.MIN_REVIEWERS }}
        env:
          RULESET_ID: ${{ steps.resolve.outputs.ruleset_id }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${ORG}/${REPO}/rulesets/${RULESET_ID}" \
            --jq '.rules[] | select(.type == "pull_request") | .parameters.required_approving_review_count')

          if [ -z "${COUNT}" ]; then
            echo "::error::No pull_request rule found on ruleset '${RULESET_NAME}'."
            echo "The ruleset must contain a pull_request rule that sets required_approving_review_count." >&2
            exit 1
          fi

          if [ "${COUNT}" -lt "${MIN_REVIEWERS}" ]; then
            echo "::error::required_approving_review_count is ${COUNT}, expected >= ${MIN_REVIEWERS}."
            echo "Restore via: scripts/apply-branch-protection.sh" >&2
            exit 1
          fi

          echo "OK: required_approving_review_count=${COUNT} (>= ${MIN_REVIEWERS}) on '${RULESET_NAME}'"

      - name: Assert bypass_actors is empty
        env:
          RULESET_ID: ${{ steps.resolve.outputs.ruleset_id }}
        run: |
          set -euo pipefail
          BYPASS_LEN=$(gh api "repos/${ORG}/${REPO}/rulesets/${RULESET_ID}" \
            --jq '.bypass_actors | length')

          if [ "${BYPASS_LEN}" != "0" ]; then
            echo "::error::bypass_actors length is ${BYPASS_LEN}, expected 0."
            echo "A bypass actor was re-added to '${RULESET_NAME}'. See issue #101." >&2
            echo "Restore via: scripts/apply-branch-protection.sh" >&2
            exit 1
          fi

          echo "OK: bypass_actors=[] confirmed on '${RULESET_NAME}'"
