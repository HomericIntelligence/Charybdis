name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Conan dependencies
        uses: ./.github/actions/conan-install
        with:
          build_type: debug
          compiler: gcc
          output_folder: build/coverage
      - name: Configure
        run: uv run cmake --preset coverage
      - name: Build
        run: uv run cmake --build --preset coverage
      - name: Test
        run: uv run ctest --preset coverage
      - name: Generate coverage report
        run: uv run ./scripts/coverage.sh
      - name: Check threshold
        run: |
          LINE_COV=$(uv run gcovr \
            --root . \
            --filter include \
            --filter src \
            --print-summary \
            build/coverage 2>/dev/null | grep "lines:" | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-0}%"
          uv run python3 -c "import sys; cov=float('${LINE_COV:-0}'); sys.exit(0 if cov >= 80 else 1)"

  check-all:
    name: All Coverage Checks
    runs-on: ubuntu-24.04
    needs: [coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage check failed"; exit 1
          fi
          echo "All checks passed"
